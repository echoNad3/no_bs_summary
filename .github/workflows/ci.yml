name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: npm run check:bundles

      - run: npx playwright install --with-deps chromium

      - run: npm run smoke:a11y

      # Validates that the Worker still bundles for the Cloudflare runtime.
      # Deploys stay manual (npm run deploy) with the owner's wrangler login.
      - run: npx wrangler deploy --dry-run --outdir build-check
