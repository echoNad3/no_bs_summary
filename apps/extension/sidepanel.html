<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        color-scheme: dark;
        background: #161616;
      }
    </style>
    <title>No BS Summary</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-lockup">
          <img class="brand-icon" src="/icons/icon-128.png" alt="" width="36" height="36" />
          <h1>No BS Summary</h1>
        </div>
        <button
          id="settings-button"
          class="icon-button"
          type="button"
          aria-label="Open settings"
          aria-haspopup="dialog"
        >
          <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63 1.7 1.7 0 0 0 10 3.08V3h4v.08A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9 1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"
            />
          </svg>
        </button>
      </header>

      <section class="composer-card" aria-label="Summarize a video">
        <form id="summary-form" novalidate>
          <div id="video-context" class="video-context" data-detected="false">
            <img id="video-thumbnail" alt="" width="160" height="90" hidden />
            <strong id="detected-title">No YouTube video detected</strong>
            <span id="context-label" class="sr-only">Current video</span>
          </div>

          <div class="manual-link-field">
            <label for="url">YouTube link</label>
            <input
              id="url"
              name="url"
              type="url"
              inputmode="url"
              autocomplete="url"
              autocapitalize="none"
              autocorrect="off"
              enterkeyhint="go"
              spellcheck="false"
              placeholder="https://youtu.be/…"
              required
            />
          </div>
          <input id="title" name="title" type="hidden" />

          <div class="submit-actions">
            <button id="submit" class="primary-button" type="submit">Cut the BS</button>
            <button id="cancel-request" class="secondary-button" type="button" hidden>
              Cancel
            </button>
          </div>
        </form>

        <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
        <div id="error-actions" class="error-actions" hidden>
          <button id="retry-request" class="secondary-button" type="button">Retry</button>
          <button id="copy-diagnostics" class="secondary-button" type="button">
            Copy diagnostics
          </button>
        </div>
      </section>

      <section id="result" class="result" aria-label="Summary result" tabindex="-1" hidden>
        <span id="verdict" class="verdict"></span>
        <p id="reason" class="reason"></p>
        <div id="summary" class="summary"></div>
        <div class="result-actions">
          <button id="copy-summary" class="action-button" type="button" aria-label="Copy summary">
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="8" y="8" width="11" height="11" rx="2" />
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
            </svg>
            <span class="sr-only action-label">Copy summary</span>
          </button>
        </div>
      </section>

      <dialog id="settings-dialog" aria-labelledby="settings-title">
        <div class="dialog-heading">
          <h2 id="settings-title">Settings</h2>
          <button
            id="close-settings"
            class="icon-button dialog-close"
            type="button"
            aria-label="Close settings"
          >
            <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 7l10 10M17 7 7 17" />
            </svg>
          </button>
        </div>

        <div class="settings-fields">
          <div class="field-group">
            <label for="password">Password</label>
            <div class="password-control">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                maxlength="200"
              />
              <button
                id="toggle-password"
                class="password-toggle"
                type="button"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="field-group compact-field">
            <label for="text-size">Text size</label>
            <select id="text-size" name="text-size">
              <option value="normal">Normal</option>
              <option value="large">Large</option>
              <option value="extra-large">Extra large</option>
            </select>
          </div>

          <div class="settings-section">
            <div class="section-heading">
              <h3>Connection</h3>
              <button id="test-connection" class="small-button" type="button">Test</button>
            </div>
            <p id="connection-status" class="settings-status" role="status" aria-live="polite"></p>
          </div>

          <div class="resource-actions">
            <a
              class="resource-link"
              href="https://transcriptapi.com/billing"
              target="_blank"
              rel="noreferrer"
              >TranscriptAPI billing
              <svg class="resource-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 5h5v5M19 5l-8 8" />
                <path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></svg
            ></a>
            <a
              class="resource-link"
              href="https://chromewebstore.google.com/detail/no-bs-summary/fnphiadakmbpimdclfohfpbbliejhnmc"
              target="_blank"
              rel="noreferrer"
              >Chrome Web Store
              <svg class="resource-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 5h5v5M19 5l-8 8" />
                <path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></svg
            ></a>
            <a
              class="resource-link"
              href="https://github.com/echoNad3/no_bs_summary"
              target="_blank"
              rel="noreferrer"
              >GitHub repo
              <svg class="resource-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 5h5v5M19 5l-8 8" />
                <path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></svg
            ></a>
          </div>

          <button id="save-settings" class="primary-button full-width" type="button">Done</button>
        </div>
      </dialog>
    </main>
    <script type="module" src="/src/sidepanel.ts"></script>
  </body>
</html>
